<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>실모벅벅 - 모의고사 타이머</title>
    <meta name="description" content="실제 수능 시간표 그대로 흐르는 모의고사 타이머. 문항별 풀이 시간(EXP 모드) 측정, 정답 빠른 입력 채점, 파트별 누적 오답 통계까지." />
    <meta name="keywords" content="모의고사 타이머, 수능 타이머, 실모, 수능 시계, 문항별 시간, 오답 분석, 모의고사 채점" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      // 다크 모드 깜빡임 방지: 화면을 그리기 전에 저장된 테마 적용
      try {
        var t = JSON.parse(localStorage.getItem('csat-timer:theme') || '"system"');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta name="application-name" content="실모벅벅" />
    <meta name="apple-mobile-web-app-title" content="실모벅벅" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- 공유 미리보기 (카카오톡·인스타·X). og:url / 절대경로 og:image 는 빌드 시 SITE_URL 로 채워짐 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="실모벅벅" />
    <meta property="og:title" content="실모벅벅 - 모의고사 타이머" />
    <meta property="og:description" content="실제 수능 시간표 그대로 · 문항별 풀이 시간 분석 · 빠른 채점 · 파트별 누적 오답 통계" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>실모벅벅을 사용하려면 브라우저에서 JavaScript를 켜주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
